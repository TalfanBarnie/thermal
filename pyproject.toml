[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal"
version = "0.0.1"
description = "Volcanic thermal anomaly detection over Iceland from Meteosat imagery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eumdac>=3.0",
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "pyproj>=3.6",
    "shapely>=2.0",
    "boto3>=1.34",
    "Pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
train = ["torch", "scikit-learn", "pandas", "pyarrow"]
analysis = ["cmdstanpy", "pandas", "pyarrow", "matplotlib"]

[project.scripts]
thermal = "thermal.cli:main"

[tool.setuptools.packages.find]
include = ["thermal*", "training*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
