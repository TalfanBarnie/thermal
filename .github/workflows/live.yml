name: live
# Hourly catch-up: fetch every new image since the stored state (bounded), apply the background
# model, and publish anomaly products and time series rows for the web app.
on:
  # Hourly schedule disabled while the eruption-window backfill uses the Actions budget.
  # Re-enable by restoring:
  #   schedule:
  #     - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sats:
        description: source keys (space separated)
        default: msg-0deg
      lookback_hours:
        default: "6"
      max_timestamps:
        default: "12"
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      B2_PUBLIC_KEY_ID: ${{ secrets.B2_PUBLIC_KEY_ID }}
      B2_PUBLIC_APPLICATION_KEY: ${{ secrets.B2_PUBLIC_APPLICATION_KEY }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PUBLIC_BUCKET: ${{ vars.B2_PUBLIC_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PUBLIC_URL: ${{ vars.B2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: >
          thermal live --sats ${{ inputs.sats || 'msg-0deg' }}
          --lookback-hours "${{ inputs.lookback_hours || '6' }}"
          --max-timestamps "${{ inputs.max_timestamps || '12' }}"
