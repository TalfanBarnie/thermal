name: pages
# Publishes web/ to GitHub Pages. Requires Pages to be enabled with source "GitHub Actions"
# in the repository settings. Runs on pushes to the default branch and on manual dispatch.
on:
  push:
    branches: [main, master, claude/stoic-wright-lfm0jf]
    paths: ["web/**", "data/eruptions.csv", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble site
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp data/eruptions.csv _site/data/eruptions.csv
          cat > _site/config.js <<EOT
          window.THERMAL_CONFIG = {
            dataBase: "${{ vars.B2_PUBLIC_URL }}",
            eruptionsCsv: "data/eruptions.csv",
          };
          EOT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
