name: fetch one timestamp
# Milestone M1: fetch one image and cloud mask cutout through the Data Tailor,
# store them in the private bucket, and upload the metadata report as an artifact.
# The default time is during the 16 March 2024 Sundhnukur eruption (night).
on:
  workflow_dispatch:
    inputs:
      sat:
        description: satellite key
        default: msg-0deg
      time:
        description: nominal image time (ISO 8601 UTC)
        default: "2024-03-16T22:00:00Z"
      upload:
        description: store the cutouts in the private bucket
        type: boolean
        default: true
      print_quicklooks:
        description: also print the quicklook PNGs base64-encoded into the log (debugging)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      B2_PUBLIC_KEY_ID: ${{ secrets.B2_PUBLIC_KEY_ID }}
      B2_PUBLIC_APPLICATION_KEY: ${{ secrets.B2_PUBLIC_APPLICATION_KEY }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PUBLIC_BUCKET: ${{ vars.B2_PUBLIC_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PUBLIC_URL: ${{ vars.B2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: >
          thermal fetch --sat "${{ inputs.sat }}" --time "${{ inputs.time }}"
          --out "$RUNNER_TEMP/fetch" --quicklook ${{ inputs.upload == false && '--no-upload' || '' }}
      - name: print quicklooks (base64) for inspection without artifact access
        if: ${{ inputs.print_quicklooks }}
        run: |
          for f in "$RUNNER_TEMP"/fetch/quicklook/*/*.png; do
            echo "=== BEGIN $(basename "$(dirname "$f")")/$(basename "$f")"
            base64 -w0 "$f"; echo
            echo "=== END"
          done
      - name: upload metadata report and quicklooks (no numerical satellite data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-report
          path: |
            ${{ runner.temp }}/fetch/*.json
            ${{ runner.temp }}/fetch/quicklook/**/*.png
          if-no-files-found: ignore
