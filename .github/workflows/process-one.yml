name: process one timestamp
# Fetch (or reuse), model and publish products and time series rows for one nominal time.
on:
  workflow_dispatch:
    inputs:
      sat:
        default: msg-0deg
      time:
        description: nominal image time (ISO 8601 UTC)
        default: "2024-03-16T22:00:00Z"
      force:
        description: re-process even if products exist
        type: boolean
        default: false
      model_sat:
        description: borrow another source's models (e.g. msg-0deg); empty for the source's own
        default: ""
      dry_run:
        description: keep products and rows on the runner (uploaded as a workflow artifact)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      B2_PUBLIC_KEY_ID: ${{ secrets.B2_PUBLIC_KEY_ID }}
      B2_PUBLIC_APPLICATION_KEY: ${{ secrets.B2_PUBLIC_APPLICATION_KEY }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PUBLIC_BUCKET: ${{ vars.B2_PUBLIC_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PUBLIC_URL: ${{ vars.B2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: satpy for native cropping (RSS)
        if: ${{ inputs.sat == 'msg-rss' }}
        run: pip install -e ".[native]"
      - run: >
          thermal process --sat "${{ inputs.sat }}" --time "${{ inputs.time }}" --out out
          ${{ inputs.force && '--force' || '' }}
          ${{ inputs.model_sat && format('--model-sat {0}', inputs.model_sat) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: dry-run products (derived products only, no raw cutouts)
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            out/dry-run/public/
            out/dry-run/private/products/
            out/dry-run/private/timeseries/
          retention-days: 7
          if-no-files-found: warn
