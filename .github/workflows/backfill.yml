name: backfill
# Resumable batch fetch of many timestamps through the Data Tailor into the private bucket.
# Re-dispatch with the same job_id to continue where the previous run stopped.
on:
  workflow_dispatch:
    inputs:
      sat:
        description: source key
        default: msg-0deg
      job_id:
        description: state file name (reuse to resume)
        required: true
      list:
        description: CSV of sat,time rows in the repo (from `thermal sample`); leave empty to use start/end
        default: ""
      start:
        description: start time (ISO 8601) when no list is given
        default: ""
      end:
        description: end time (ISO 8601) when no list is given
        default: ""
      step_minutes:
        description: cadence when no list is given
        default: "60"
      max_minutes:
        description: wall-clock budget for submitting work (in-flight customisations may add up to 15 min)
        default: "300"
      concurrency:
        description: simultaneous Data Tailor customisations
        default: "2"
      chain:
        description: re-dispatch this workflow automatically while timestamps remain
        type: boolean
        default: true
      mode:
        description: fetch raw cutouts only, or process (fetch, model, publish)
        type: choice
        options: [fetch, process]
        default: fetch
      force:
        description: process mode only, re-make products that already exist
        type: boolean
        default: false
      only_stored:
        description: skip timestamps whose cutout is not in the bucket yet (no Data Tailor use)
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      B2_PUBLIC_KEY_ID: ${{ secrets.B2_PUBLIC_KEY_ID }}
      B2_PUBLIC_APPLICATION_KEY: ${{ secrets.B2_PUBLIC_APPLICATION_KEY }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PUBLIC_BUCKET: ${{ vars.B2_PUBLIC_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PUBLIC_URL: ${{ vars.B2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: backfill
        id: backfill
        run: |
          EXTRA="--mode ${{ inputs.mode || 'fetch' }} ${{ inputs.force && '--force' || '' }} ${{ inputs.only_stored && '--only-stored' || '' }}"
          if [ -n "${{ inputs.list }}" ]; then
            thermal backfill --sat "${{ inputs.sat }}" --job-id "${{ inputs.job_id }}" \
              --list "${{ inputs.list }}" --max-minutes "${{ inputs.max_minutes }}" \
              --concurrency "${{ inputs.concurrency }}" --summary-json "$RUNNER_TEMP/summary.json" $EXTRA
          else
            thermal backfill --sat "${{ inputs.sat }}" --job-id "${{ inputs.job_id }}" \
              --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
              --step-minutes "${{ inputs.step_minutes }}" --max-minutes "${{ inputs.max_minutes }}" \
              --concurrency "${{ inputs.concurrency }}" --summary-json "$RUNNER_TEMP/summary.json" $EXTRA
          fi
          echo "remaining=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/summary.json'))['remaining'])")" >> "$GITHUB_OUTPUT"
      - name: re-dispatch while work remains
        # Runs even if the job was cancelled by its timeout: a missing summary counts as "work remains".
        if: ${{ always() && inputs.chain && steps.backfill.outputs.remaining != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run backfill.yml --ref "$GITHUB_REF_NAME"
          -f sat="${{ inputs.sat }}" -f job_id="${{ inputs.job_id }}" -f list="${{ inputs.list }}"
          -f start="${{ inputs.start }}" -f end="${{ inputs.end }}" -f step_minutes="${{ inputs.step_minutes }}"
          -f max_minutes="${{ inputs.max_minutes }}" -f concurrency="${{ inputs.concurrency }}" -f chain=true
          -f mode="${{ inputs.mode || 'fetch' }}" -f force=${{ inputs.force && 'true' || 'false' }}
          -f only_stored=${{ inputs.only_stored && 'true' || 'false' }}
