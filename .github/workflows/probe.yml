name: probe download access
# Checks whether the account may download image products of various ages (embargo finder).
on:
  workflow_dispatch:
    inputs:
      sat:
        default: msg-0deg
      ages:
        description: ages in hours, space separated
        default: "0.5 1 2 3 4 6 12 24 48 72 168"
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
      EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      B2_PUBLIC_KEY_ID: ${{ secrets.B2_PUBLIC_KEY_ID }}
      B2_PUBLIC_APPLICATION_KEY: ${{ secrets.B2_PUBLIC_APPLICATION_KEY }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PUBLIC_BUCKET: ${{ vars.B2_PUBLIC_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PUBLIC_URL: ${{ vars.B2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: thermal probe --sat "${{ inputs.sat }}" --ages ${{ inputs.ages }}
