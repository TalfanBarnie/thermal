# Data sources, one per orbital slot / service. The platform occupying a slot changes over
# the archive (e.g. the 0 degree service was Meteosat-10/MSG3 in March 2024), so the platform
# is NOT fixed here: it is read from each product's metadata and recorded with the data.
# Background models are trained per (source, platform) pair, e.g. msg-0deg/MSG3.
# Fields marked verify are to be confirmed during milestone M1.
msg-0deg:
  description: MSG SEVIRI, 0 degree full disk service (15 min)
  instrument: SEVIRI
  collection: EO:EUM:DAT:MSG:HRSEVIRI
  cloudmask_collection: EO:EUM:DAT:MSG:CLM
  tailor_product: HRSEVIRI
  tailor_cloudmask_product: MSGCLMK
  platform_filter: null               # optional Data Store 'sat' value (MSG1..MSG4) to restrict to
  sub_lon: 0.0
  cadence_minutes: 15
  mir_channel: IR_039
  channels: [VIS006, VIS008, IR_016, IR_039, WV_062, WV_073, IR_087, IR_097, IR_108, IR_120, IR_134]
  # Data Tailor netCDF variable names -> channel names (SEVIRI band order; HRV is not included)
  variable_map: {channel_1: VIS006, channel_2: VIS008, channel_3: IR_016, channel_4: IR_039,
                 channel_5: WV_062, channel_6: WV_073, channel_7: IR_087, channel_8: IR_097,
                 channel_9: IR_108, channel_10: IR_120, channel_11: IR_134}
  cloudmask_variable: cloud_mask
  monitoring_regions: [reykjanes]

msg-rss:
  description: MSG SEVIRI, rapid scan service from 9.5E (5 min)
  instrument: SEVIRI
  collection: EO:EUM:DAT:MSG:MSG15-RSS
  cloudmask_collection: EO:EUM:DAT:MSG:RSS-CLM
  tailor_product: HRSEVIRI            # verify
  tailor_cloudmask_product: MSGCLMK   # verify
  platform_filter: null
  sub_lon: 9.5
  cadence_minutes: 5
  mir_channel: IR_039
  channels: [VIS006, VIS008, IR_016, IR_039, WV_062, WV_073, IR_087, IR_097, IR_108, IR_120, IR_134]
  variable_map: {channel_1: VIS006, channel_2: VIS008, channel_3: IR_016, channel_4: IR_039,
                 channel_5: WV_062, channel_6: WV_073, channel_7: IR_087, channel_8: IR_097,
                 channel_9: IR_108, channel_10: IR_120, channel_11: IR_134}   # verify
  cloudmask_variable: cloud_mask
  monitoring_regions: [reykjanes]

mtg-0deg:
  description: MTG FCI, 0 degree full disk, FDHSI (10 min)
  instrument: FCI
  collection: EO:EUM:DAT:0662         # verify
  cloudmask_collection: null          # verify
  tailor_product: FCIL1FDHSI          # verify
  tailor_cloudmask_product: null
  platform_filter: null
  sub_lon: 0.0
  cadence_minutes: 10
  mir_channel: ir_38
  channels: [vis_04, vis_05, vis_06, vis_08, vis_09, nir_13, nir_16, nir_22, ir_38, wv_63, wv_73, ir_87, ir_97, ir_105, ir_123, ir_133]
  monitoring_regions: [reykjanes]
