datatailor:
  format: netcdf4
  poll_seconds: 15
  timeout_seconds: 900   # a customisation stuck longer than this is abandoned and retried
  # The Data Tailor web service allows this account 3 queued+running customisations in
  # total, across every job and workflow. Keep the sum of all running jobs' concurrency
  # at or below this; above it, submissions fail with "exceeding your maximum number".
  max_concurrent_total: 3
search:
  # half-width of the sensing-time window used when looking up a product at a nominal time
  tolerance_minutes: 20
live:
  # Image products younger than this are refused by the Data Store for this account
  # (a ~1 hour near-real-time embargo, measured with `thermal probe` in M4), so the live
  # loop only considers nominal times older than this.
  min_age_minutes: 75
  lookback_hours: 6
  max_timestamps: 12
